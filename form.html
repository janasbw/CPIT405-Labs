<!DOCTYPE html>

<html>
<form action="">

    <h3>Register Form:</h3>

    <!-- Name -->
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"
           placeholder="Enter your name">

    <br>

    <!-- Email -->
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email"
           placeholder="Enter your email address">

    <br>

    <!-- Telephone -->
    <label for="tel">Tel:</label>
    <input type="tel" id="tel" name="tel"
           placeholder="Enter your Tel no.">

    <br>

    <!-- Gender -->
    <label>Gender:</label>

    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" value="male">

    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="female">

    <br>

    <!-- Contact -->
    <label>Contact:</label>

    <input type="checkbox" id="email-contact"
           name="contact" value="email">
    <label for="email-contact">email</label>

    <input type="checkbox" id="tel-contact"
           name="contact" value="tel">
    <label for="tel-contact">tel</label>

    <input type="checkbox" id="sms-contact"
           name="contact" value="sms">
    <label for="sms-contact">SMS</label>

    <br>

    <!-- Buttons -->
    <input type="submit" value="Send">
    <input type="reset" value="Clear">

</form>
</html>
