<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPIT-405 Lab 3</title>

    <style>

        /* Question 1 */
        .image-preview img {
            border-style: solid;
            border-width: 30px;
            border-color: skyblue lightpink lightgreen #ffefd5;
        }


        /* Question 2 */
        p > span {
            color: red;
        }

        #header span {
            color: pink;
        }

        span {
            color: green;
        }

        #header *:last-child {
            color: orange;
        }

        #header span:first-child:hover {
            color: blue;
        }

    </style>

</head>

<body>

    <h1>Lab 3: CSS</h1>


    <!-- Question 1 -->

    <h2>Question 1</h2>

    <div class="image-preview">
        <img src="Kau.jpg.WEBP"
             alt="KAU Logo">
    </div>


    <hr>


    <!-- Question 2 -->

    <h2>Question 2</h2>

    <div id="header">
        <span class="myclass1">Every</span>
        <span class="myclass2">one can</span>
        <span class="myclass3">success.</span>
    </div>

    <p>
        One machine can do the work of fifty ordinary men.
        <span class="myclass4">
            No machine can do the work of one extraordinary man.
        </span>
    </p>


    <!-- Answer Table -->

    <table border="1">

        <tr>
            <th></th>
            <th>color</th>
            <th>color when mouse over</th>
        </tr>

        <tr>
            <th>span.myclass1</th>
            <td>pink</td>
            <td>blue</td>
        </tr>

        <tr>
            <th>span.myclass2</th>
            <td>pink</td>
            <td>pink</td>
        </tr>

        <tr>
            <th>span.myclass3</th>
            <td>orange</td>
            <td>orange</td>
        </tr>

        <tr>
            <th>span.myclass4</th>
            <td>red</td>
            <td>red</td>
        </tr>

    </table>

</body>

</html>
